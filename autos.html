<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css"/>
    <title>Autos</title>
</head>
<body>

    <main>
        <section id="principal">
        <h1 id="titulo">Autos</h1>

            <section id="section-1">
                <section class="secundario">
                    <article class="articulo">
                  <form name="datos_auto" method="post" action="#" enctype="multipart/form-data">
                    <fieldset>
                        <legend>Datos de Registro:</legend>
                        <article id="registro">
                            <label>Fecha de registro:</label>
                            <input type="date" id="fecha"/><br>
                        </article>
                    </fieldset>
                    <fieldset id="datos_auto">
                        <legend>Datos del auto:</legend>
                        <article id="identificacion">
                            <article>
                                <label>Modelo: </label>
                                <input type="text" id="modelo"/><br>
                            </article>
                            <article>
                                <label>Año: </label>
                                <input type="number" id="anio" min="1950" max="2100"/><br>
                            </article>
                            <article>
                                <label>Número de auto: </label>
                                <input type="number" id="numero" min="0" max="99"/><br>
                            </article>
                        </article>
                        <article id="otros_datos">
                            <article id="neumaticos">
                                <label>Neumático:</label>
                                <input type="radio" name="neu" value="S"/>Blando
                                <input type="radio" name="neu" value="M"/>Medio
                                <input type="radio" name="neu" value="H"/>Duro
                            </article>
                            <article>
                                <label>Escudería: </label>
                                <select id="escuderia">
                                    <option value=""></option>
                                    <option value="FER">Ferrari</option>
                                    <option value="MER">Mercedes</option>
                                    <option value="RBR">Red Bull Racing</option>
                                    <option value="MCL">McLaren</option>
                                    <option value="AST">Aston Martin</option>
                                </select><br>
                            </article>
                            <article>
                                <label>Peso (kg): </label>
                                <input type="number" id="peso" min="700" step="0.1"/><br>
                            </article>
                            <article>
                                <label>Foto:</label>
                                <input type="file" id="imagen" /><br>
                            </article>
                        </article>
                    </fieldset>
                    <fieldset>
                        <legend>Generalidades </legend>
                        <article>
                            <label>Color del auto: </label>
                            <input type="color" id="colorf"/>
                        </article>
                        <article>
                            <label>Comentarios: </label>
                            <textarea cols="50" rows="10" id="comms"></textarea>
                        </article>
                    </fieldset>
                    <button type="button" id="boton" onclick="mi_metodoAutos()">Registrar</button>
                  </form>
                    </article>
                </section>
            </section>

            <aside id="menu">
                <h3>MENU</h3>
                    <ol>
                        <li class="opmnu"><a href="home.html">Home</a></li>
                        <li class="opmnu"><a href="autos.html">Autos</a></li>
                        <li class="opmnu"><a href="escuderia.html">Escudería</a></li>
                        <li class="opmnu"><a href="corredor.html">Corredor</a></li>
                        <li class="opmnu"><a href="relaciones.html">Relaciones</a></li>
                    </ol>
            </aside>
        </section>
    </main>

    <footer>
        <article class="nm">Donovan Alexis Ruiz Macias</article>
        <article class="gpo">LDSM405</article>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
