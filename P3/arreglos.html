<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Programitas</title>
</head>
<body>
    <header class="container-fluid p-5 bg-dark text-white text-center">
        <h1>Programitas</h1>
        <hr>
    </header>

    <article class="col-sm-4">
            <h3>Temperaturas</h3>        
            <button class="btn btn-warning" onclick="cargar()">Capturar 7 Temperaturas</button>
            <button class="btn btn-success" onclick="mostrar()">Mostrar promedio min y max</button>
            <p id="imprimirT"></p>
          </article>



          <article class="col-sm-4">

            <h3>Sueldos</h3>

            <select name="puesto" id="puesto" class="form-select">

                <option value="0">Diseñador</option>
                <option value="1">Programador</option>
                <option value="2">Lider</option>

            </select><br>

            <select name="puesto" id="nivel" class="form-select">

                <option value="0">Newbe</option>
                <option value="0">Jr</option>
                <option value="0">Sr</option>

            </select><br>

            <input type="number" id="hrs" class="form-control"><br>

            <button class="btn btn-warning" onclick="sueldos()">Calcular</button><br>

            <p id="resultado"></p>

        
          </article>

          <article class="col-sm-4">

    <h3>Numero</h3>
    <button class="btn btn-warning" onclick="matriz()">Mostrar</button>
    <pre id="imprimirM"></pre>

</article>


<article class="col-sm-6">

    <h3>Nombres</h3>
    <button class="btn btn-warning" onclick="capturarNombres()">Capturar 10 nombres</button>
    <button class="btn btn-success" onclick="eliminarRango()">Eliminar rango</button>
    <button class="btn btn-danger" onclick="vaciarNombre()">Vaciar un nombre</button>
    <p id="imprimirN"></p>

</article>


          <script src="js/arreglos.js"></script>
</body>
</html>
